<!DOCTYPE html>
<html lang="es">
<!-- Header con Métricas KPI y Clima -->
   <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutas Seguras Kids - Gestión de Transporte</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js" defer></script>
</head>
<body>
  <div class="container">
    
    <!-- Header con Métricas KPI y Clima -->
    <header class="main-header">
      <div>
        <h1>Rutas Seguras Kids</h1>
        <p>Gestión eficiente y segura de transporte escolar</p>
      </div>

      <div class="kpi-container">
        <!-- Widget del Clima -->
        <div class="kpi-card" id="weather-widget">
          <div class="number" id="weather-temp">-- °C</div>
          <div class="label" id="weather-city">📍 San Gil, CO</div>
        </div>

        <!-- KPIs -->
        <div class="kpi-card">
          <div class="number" id="kpi-total-routes">0</div>
          <div class="label">Rutas</div>
        </div>
        <div class="kpi-card">
          <div class="number" id="kpi-total-students">0</div>
          <div class="label">Estudiantes</div>
        </div>
      </div>
    </header>

    <!-- Formularios principales -->
    <div class="forms-wrapper">
      
      <!-- Formulario Crear/Editar Ruta -->
      <section class="card-form">
        <h2 id="form-title">Crear Nueva Ruta</h2>
        <form id="route-form">
          <input type="hidden" id="edit-route-id">
          
          <div class="form-group">
            <label for="route-name">Nombre de la Ruta:</label>
            <input type="text" id="route-name" placeholder="Ej. Ruta Norte - Primaria">
            <span class="error-msg" id="err-route-name"></span>
          </div>

          <div class="form-group">
            <label for="driver-name">Nombre del Conductor:</label>
            <input type="text" id="driver-name" placeholder="Ej. Carlos Mendoza">
            <span class="error-msg" id="err-driver-name"></span>
          </div>

          <div class="form-group">
            <label for="departure-time">Hora de Salida:</label>
            <input type="time" id="departure-time">
            <span class="error-msg" id="err-departure-time"></span>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn primary" id="btn-save-route">Guardar Ruta</button>
            <button type="button" class="btn secondary" id="btn-fetch-driver">Cargar Conductor (API)</button>
          </div>
        </form>
      </section>

      <!-- Formulario Asignar Estudiante -->
      <section class="card-form">
        <h2>Asignar Estudiante</h2>
        <form id="student-form">
          <div class="form-group">
            <label for="select-route">Seleccionar Ruta:</label>
            <select id="select-route">  

              <option value="">-- Seleccione una ruta --</option>
            </select>
            <span class="error-msg" id="err-select-route"></span>
          </div>

          <div class="form-group">
            <label for="student-name">Nombre del Estudiante:</label>
            <input type="text" id="student-name" placeholder="Ej. Laura Gómez">
            <span class="error-msg" id="err-student-name"></span>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn primary">Asignar Estudiante</button>
            <button type="button" class="btn secondary" id="btn-fetch-student">Obtener de API</button>
          </div>
        </form>
      </section>

    </div>

<!-- Sección Filtro de Estudiantes -->
<section class="card-form" style="margin-bottom: 2rem;">
  <h2>Filtro de Estudiantes por Ruta</h2>
  <div class="form-group">
    <label for="filter-route">Filtrar por Ruta:</label>
    <select id="filter-route">
      <option value="Todas">Todas</option>
      <option value="Ruta Norte">Ruta Norte</option>
      <option value="Ruta Sur">Ruta Sur</option>
      <option value="Ruta Centro">Ruta Centro</option>
    </select>
  </div>
  
  <ul id="students-list" class="students-filter-list">
    <!-- Aquí JavaScript renderizará los estudiantes filtrados -->
  </ul>
</section>

    <!-- Sección de Rutas Registradas -->
    <main>
      <h2 style="margin-bottom: 1rem; color: #0f172a;">Rutas Registradas</h2>
      <div id="routes-container" class="grid-routes">
        <!-- Se renderizan los Custom Elements <route-card> dinámicamente -->
      </div>
    </main>

  </div>
</body>
</html>
